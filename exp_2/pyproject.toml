[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "windbubble-exp2"
version = "0.1.0"
description = "Semi-analytic adiabatic wind-bubble model and 1D spherical hydro code"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
plots = ["matplotlib"]

[tool.setuptools]
packages = ["windbubble", "hydro1d"]
